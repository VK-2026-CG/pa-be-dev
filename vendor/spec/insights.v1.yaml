openapi: 3.0.3
info:
  title: PRUAction — Insights Domain API
  version: 1.8.0
  description: |
    Domain API for the **Insights** bounded context (agent performance):
    metric snapshots, metric detail, historical series, milestone progress,
    metric definitions (catalog), agent metric preferences and performance
    recommendations.

    ## DDD notes
    - This API exposes **read models** materialized by data pipelines (CQRS).
      The only command surface is `PUT /agents/{agentId}/metric-preferences`.
    - Screen composition is a **BFF concern**. There is intentionally no
      `/dashboard` endpoint here; the Next.js BFF composes `listAgentMetrics`
      + `listMilestoneProgress` + `listRecommendations` into the dashboard VM.

    ## Tenancy & authorization
    - Country/tenant is resolved from the JWT (`cty` claim). All data and
      catalog reads are tenant-scoped.
    - `agentId` in the path MUST match the token subject unless the caller
      holds the `insights:read:downline` scope (leader viewing a downline).

    ## Conventions
    - Monetary values are decimal **strings** with ISO 4217 currency (D-04).
    - All values use the discriminated `MetricScalar` union (D-03).
    - `sentiment` is computed server-side per metric rules (D-05).
    - Enums marked `x-extensible-enum: true` may gain values in a minor
      release; clients MUST tolerate unknown values.
    - Labels are never returned; clients resolve i18n from codes (D-08).
    - GET responses are cacheable for short TTLs and return `ETag`;
      clients SHOULD send `If-None-Match`.

    ## Changelog
    - **1.1.0** (P2/P3 Agent Leader pack, additive): `scope` (SELF|TEAM) and
      `teamView` (DIRECT|GROUP) dimensions; DECIMAL scalar kind; absolute
      `Change.abs`; snapshot `subMeasures`; `MetricDetail.barComparison`;
      catalog `scopes`/`favourability`/`changeDisplay`/`scopeOverrides`;
      `yearsBack=0` (current-year series); expanded AI recommendation payload
      + feedback op. `1.0.0` clients are unaffected.
    - **1.2.0** (P4 uplift, additive): `MetricDetail.dataState`
      (OK|PROCESSING|EMPTY — designed full-screen states) and
      `MetricDetail.notices[]` (dismissible data-gap banners, e.g.
      "No data is available for Credit Points"). MTD confirmed in period
      options; NEW_RECRUIT_CONTRACTED bar comparison applies to SELF too.
    - **1.3.0** (business rulings, additive): `basis` re-documented as an
      **agent-segment lens** (SCHEME = Prudential-employed full-time agents
      with different goals / metric set / ordering — wire values unchanged);
      `MetricDefinition.segmentOverrides`; `teamView=GROUP` gated to P2-level
      leaders (403 for P3).
    - **1.4.0** (upstream source onboarding): `MetricSnapshot.dataState`
      (OK|PROCESSING|EMPTY, default OK) and `MetricSnapshot.notices[]`, so a
      catalogued metric with no approved upstream source is returned as a
      renderable card state instead of being omitted. **`collected` and `goal`
      leave `required`** — they are present only when `dataState = OK`, so
      clients MUST tolerate their absence. The inline detail notice shape is
      extracted to the shared `Notice` schema (no shape change). Catalogue
      gains APE and API; see `data/source-mapping.md` (C0) for field lineage
      and metric readiness.
    - **1.5.0** (Team Drilldown draft, additive): introduces
      `listTeamMembers` and `getTeamMemberDashboard` plus Team Drilldown
      schemas (`DrilldownBasis`, `TeamMember`, `TeamMemberList`,
      `TeamMemberDashboard`) for S-P4-07 hierarchy/member-preview composition.
    - **1.5.1** (SPEC-2026-003, description-only): the MY catalog no longer
      promotes NEW_RECRUIT_CONTRACTED to PRIORITY at TEAM — it is FOCUS at
      both scopes. `scopeOverrides` shape is unchanged; only its example text
      changes. Catalog data change lives in C1 2.0.0.
    - **1.6.0** (SPEC-2026-004, S-P4-07 "My Team" UX; additive except the
      `listTeamMembers` `basis` default below, a behavioural break confined
      to the DRAFT S-P4-07 surface): optional
      `TeamMember` card fields (`badges`, `goalStatus`, `tpc`, `ptpc`,
      `directReportCount`, `photoUrl`), `TeamMemberList.summary` (team KPI
      tiles for the filtered set) and `TeamMemberList.parent`, plus
      `listTeamMembers` query params `parentMemberAgentId`, `sortBy` and
      `badges`; an omitted `basis` now means all levels (the former
      `AGENT` default is removed). New enums `MemberBadgeCode` (x-extensible),
      `TeamMemberGoalStatus`, `TeamMemberSortBy`. All new response fields
      are optional; `1.5.0` clients are unaffected. Card fields have no
      approved upstream source yet (OQ-79); unavailable fields are omitted,
      and runtime stub/memory business data is prohibited.
    - **1.6.1** (requester ruling, 2026-09-30): MongoDB is the sole runtime
      source for business data. Missing records/fields remain unavailable;
      service runtime must not fall back to in-memory data, JSON fixtures,
      deterministic sample values or synthetic Team Drilldown records.
      Contract fixtures remain test-only. A frontend-only generic agent photo
      placeholder is allowed and is not business data.
      stub/memory business data is prohibited. Contract fixtures are test-only.
    - **1.7.0** (SPEC-2026-005, additive): adds
      `GET /agents/{agentId}/organization`, a nested read-only organization
      view resolved from `my_agent_hierarchy`; see its operation contract and
      C1 mapping. Existing metric and Team Drilldown permissions are unchanged.
    - **1.8.0** (SPEC-2026-004 0.2.0-draft + SPEC-2026-005 0.2.0-draft,
      requester-approved 2026-10-01; no schema change): `listTeamMembers`
      resolves members from `my_agent_hierarchy` (C1 §6c) instead of
      returning an empty list in source mode. Organization and Team
      Drilldown traversal skip the leader's own ID in
      `subtree.scopeProfileIds`, and `displayRows.tier` maps
      case-insensitively. Hierarchy reads need no opt-in flag.
  contact:
    name: Insights Domain Team
  x-domain: insights
  x-spec-repo: pruaction-spec

servers:
  - url: https://api.{env}.pruaction.internal/insights/v1
    variables:
      env:
        default: sit
        enum: [sit, uat, prod]

security:
  - bearerAuth: []

tags:
  - name: Metrics
    description: Point-in-time metric snapshots and metric detail.
  - name: MetricSeries
    description: Monthly historical values per metric.
  - name: Milestones
    description: Progress against milestone programs (MDRT Series, Star Club, …).
  - name: Definitions
    description: Country metric catalog driving customization and UI capabilities.
  - name: Preferences
    description: Agent-level metric customization (priority / focus sets, ordering).
  - name: Recommendations
    description: Performance recommendation entries (engine-generated).
  - name: TeamDrilldown
    description: Hierarchy-scoped member listing and selected-member dashboard composition.
  - name: Organization
    description: Nested agent organization read from the approved hierarchy source.

paths:
  /agents/{agentId}/organization:
    get:
      operationId: getAgentOrganization
      tags: [Organization]
      summary: Get an agent's nested organization
      description: |
        Returns the complete organization rooted at `agentId`, including the
        root, nested reports and ID-only leaves where referenced descendants do
        not have a hierarchy document. This organization read has its own
        authorization exception: an allowlisted P2/P3 leader may read their own
        complete organization. It does not grant additional access to metrics,
        Team Drilldown or other operations; their existing gates remain intact.

        Match the requested root `agentId` against `hierarchy.leaderId` in
        PAMB first; query PBTB only when no root record exists in PAMB.
        Descendant reads stay in the selected database. Each ID in
        `subtree.scopeProfileIds` is a direct reportee ID and resolves to a
        document by matching `hierarchy.leaderId` to that ID.
        Duplicate documents sort by `asOnDate`, `audit.updatedAt`, then `_id`,
        descending. Deduplicate repeated profile IDs at first encounter and
        preserve source-array order. (1.8.0) A document that lists its own
        `hierarchy.leaderId` in `subtree.scopeProfileIds` (UM and agent
        snapshots do) skips that entry; it is not a cycle. Missing descendants are
        ID-only leaves (displayName equal to agentId, empty reports, tier
        omitted). Cycles or malformed records cannot return partial results.

        `displayName` is the profile ID. Never expose or log encrypted names,
        vault references, or raw source documents. Read role values from
        `displayRows.tier`, case-insensitively (observed `Agent`/`agent`):
        AM→P2, UM/UM1/UM2→P3, AGENT→P4. All reads
        use the existing 8-second Mongo execution budget; no writes or
        provisioning occur.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Complete nested organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOrganization'
              examples:
                nested-organization:
                  value:
                    agentId: AM100
                    displayName: AM100
                    tier: P2
                    reports:
                      - agentId: UM200
                        displayName: UM200
                        tier: P3
                        reports:
                          - agentId: AG300
                            displayName: AG300
                            tier: P4
                            reports: []
                      - agentId: AG400
                        displayName: AG400
                        tier: P4
                        reports: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Root profile is absent from both approved databases (INS-4040).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Malformed hierarchy or ancestor cycle (INS-5000); sanitized Problem, no partial organization.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Mongo query failure or execution timeout (INS-5030); sanitized Problem, no partial organization.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/{agentId}/metrics:
    get:
      operationId: listAgentMetrics
      tags: [Metrics]
      summary: List metric snapshots for an agent
      description: |
        Returns one snapshot per requested metric for the given period /
        business line / basis. Backs the **Priority Metrics** card row on
        S-P4-01. `scope=PRIORITY` resolves the agent's saved priority set
        (falling back to the country default ordering).
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/BusinessLine'
        - $ref: '#/components/parameters/Basis'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/TeamView'
        - name: scope
          in: query
          description: Which metric set to return. Ignored when `codes` is present.
          schema:
            type: string
            enum: [PRIORITY, FOCUS, ALL]
            default: PRIORITY
        - name: codes
          in: query
          description: Explicit metric codes (overrides `scope`).
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: '#/components/schemas/MetricCode'
      responses:
        '200':
          description: Snapshot list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSnapshotList'
              examples:
                my-dashboard-qtd-both:
                  summary: MY dashboard, QTD, business line ALL (matches P4 mock 1)
                  value:
                    context:
                      period: { type: QTD, startDate: '2026-07-01', endDate: '2026-07-27' }
                      businessLine: ALL
                      basis: STANDARD
                      scope: SELF
                      asOfDate: '2026-07-27'
                    items:
                      - metricCode: TPC
                        valueType: MONEY
                        variant: WITHOUT_REPRICING
                        collected: { kind: MONEY, amount: '60000.00', currency: MYR }
                        goal: { state: NOT_SET }
                        comparison:
                          basis: LAST_YEAR
                          direction: UP
                          sentiment: POSITIVE
                          pct: 27
                        asOfDate: '2026-07-27'
                      - metricCode: PTPC
                        valueType: MONEY
                        variant: WITHOUT_REPRICING
                        collected: { kind: MONEY, amount: '40000.00', currency: MYR }
                        goal: { state: NOT_SET }
                        comparison:
                          basis: LAST_YEAR
                          direction: DOWN
                          sentiment: NEGATIVE
                          pct: -27
                        asOfDate: '2026-07-27'
                      - metricCode: CASE_COUNT
                        valueType: COUNT
                        collected: { kind: COUNT, value: 5 }
                        goal: { state: NOT_SET }
                        comparison:
                          basis: LAST_YEAR
                          direction: DOWN
                          sentiment: NEGATIVE
                          pct: -27
                        asOfDate: '2026-07-27'
                      - metricCode: FYP
                        valueType: MONEY
                        collected: { kind: MONEY, amount: '180000.00', currency: MYR }
                        goal: { state: NOT_SET }
                        comparison:
                          basis: LAST_YEAR
                          direction: UP
                          sentiment: POSITIVE
                          pct: 27
                        asOfDate: '2026-07-27'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/metrics/{metricCode}:
    get:
      operationId: getMetricDetail
      tags: [Metrics]
      summary: Metric detail (gauge, comparison, variants, product breakdown)
      description: |
        Capability-driven detail for one metric (backs S-P4-02). Sections are
        present only when the country's `metric_definitions.capabilities`
        enable them **and** the pipeline populated them:
        - `primary.penders` — capability `penders` (TPC, PTPC, CASE_COUNT, FYP)
        - `altVariants[WITH_REPRICING]` — capability `repricing` (TPC, PTPC)
        - `threshold` — capability `threshold` (persistency metrics)
        - `breakdowns` — capability `breakdown` (TPC, PTPC)
        - `comparison` — **omitted** for PERSISTENCY_CY / PERSISTENCY_Y1 /
          PERSISTENCY_Y2 at both scopes (S-P4-02 v1.12.0, AC-P4-02-46:
          year-on-year comparison removed). No schema change, because
          `comparison` was already optional. ACTIVITY_RATIO and every other
          metric are unchanged.

        Persistency period (S-P4-02 v1.12.0, AC-P4-02-47): the S-P4-02 BFF
        always calls this operation with `period=YTD` for PERSISTENCY_*,
        whatever the dashboard period was. MTD/QTD persistency is still not
        substituted from YTD (C0 AC-PA-SRC-04).
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/MetricCodePath'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/BusinessLine'
        - $ref: '#/components/parameters/Basis'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/TeamView'
      responses:
        '200':
          description: Metric detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDetail'
              examples:
                my-tpc-ytd:
                  summary: TPC detail, YTD, Insurance + Takaful (P4 mock 5)
                  value:
                    metricCode: TPC
                    valueType: MONEY
                    context:
                      period: { type: YTD, startDate: '2026-01-01', endDate: '2026-07-27' }
                      businessLine: ALL
                      basis: STANDARD
                      scope: SELF
                      asOfDate: '2026-07-27'
                    primary:
                      variant: WITHOUT_REPRICING
                      collected: { kind: MONEY, amount: '100000.00', currency: MYR }
                      penders: { kind: MONEY, amount: '30000.00', currency: MYR }
                    altVariants:
                      - variant: WITH_REPRICING
                        collected: { kind: MONEY, amount: '120000.00', currency: MYR }
                    comparison:
                      current: { kind: MONEY, amount: '100000.00', currency: MYR }
                      prior: { kind: MONEY, amount: '78740.00', currency: MYR }
                      priorYear: 2025
                      change:
                        basis: LAST_YEAR
                        direction: UP
                        sentiment: POSITIVE
                        pct: 27
                    breakdowns:
                      # v1.8.0 (AC-P4-02-35): columns has exactly one entry, matching
                      # context.businessLine above (ALL here) — a combined value per
                      # row, not two Insurance/Takaful columns side by side.
                      - variant: WITHOUT_REPRICING
                        columns: [ALL]
                        rows:
                          - productCode: LINKED_PREMIUM
                            cells:
                              - { businessLine: ALL, value: { kind: MONEY, amount: '20345.00', currency: MYR } }
                          - productCode: REGULAR_PREMIUM
                            cells:
                              - { businessLine: ALL, value: { kind: MONEY, amount: '20000.00', currency: MYR } }
                          - productCode: PSA
                            weightPct: 10
                            cells:
                              - { businessLine: ALL, value: { kind: MONEY, amount: '18007.00', currency: MYR } }
                          - productCode: SINGLE_PREMIUM
                            weightPct: 10
                            cells:
                              - { businessLine: ALL, value: { kind: MONEY, amount: '22000.00', currency: MYR } }
                          - productCode: CREDIT_POINTS
                            weightPct: 10
                            cells:
                              - { businessLine: ALL, value: { kind: MONEY, amount: '4000.70', currency: MYR } }
                        totals:
                          - { businessLine: ALL, value: { kind: MONEY, amount: '84352.70', currency: MYR } }
                my-persistency-y1:
                  summary: First Year Persistency detail (P4 mock 10)
                  value:
                    metricCode: PERSISTENCY_Y1
                    valueType: PERCENT
                    context:
                      period: { type: YTD, startDate: '2026-01-01', endDate: '2026-07-27' }
                      businessLine: ALL
                      basis: STANDARD
                      scope: SELF
                      asOfDate: '2026-07-27'
                    primary:
                      collected: { kind: PERCENT, value: 95 }
                    threshold: { value: 85, comparator: GTE }
                    # S-P4-02 v1.12.0 (AC-P4-02-46): no `comparison` for
                    # persistency (was 95 vs 93, +2pp). AC-P4-02-47: context
                    # period is always YTD for persistency.
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/metrics/{metricCode}/series:
    get:
      operationId: getMetricSeries
      tags: [MetricSeries]
      summary: Monthly historical series for a metric
      description: |
        Backs S-P4-03 (Historical Data). Returns the anchor year plus
        `yearsBack` prior years, each with 12 monthly points (`yearsBack=0`
        returns the anchor year alone — the "Current Year" history window;
        the BFF derives month-over-month deltas client-side using the
        catalog's `favourability`); months with no
        data yet are `value: null`. The UI pager shifts `anchorYear`.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/MetricCodePath'
        - $ref: '#/components/parameters/BusinessLine'
        - $ref: '#/components/parameters/Basis'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/TeamView'
        - name: anchorYear
          in: query
          description: Latest year in the window. Default = current cycle year.
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: yearsBack
          in: query
          description: Number of prior years to include alongside the anchor year.
          schema: { type: integer, minimum: 0, maximum: 4, default: 2 }
      responses:
        '200':
          description: Monthly series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
              examples:
                my-tpc-history:
                  summary: TPC vs last 2 years (P4 mock 4, truncated)
                  value:
                    metricCode: TPC
                    valueType: MONEY
                    context: { businessLine: ALL, basis: STANDARD, scope: SELF, asOfDate: '2026-07-27' }
                    anchorYear: 2026
                    series:
                      - year: 2026
                        points:
                          - { month: 1, value: { kind: MONEY, amount: '25246.00', currency: MYR } }
                          - { month: 2, value: { kind: MONEY, amount: '15876.00', currency: MYR } }
                          - { month: 7, value: { kind: MONEY, amount: '11007.00', currency: MYR } }
                          - { month: 8, value: null }
                      - year: 2025
                        points:
                          - { month: 1, value: { kind: MONEY, amount: '22246.00', currency: MYR } }
                          - { month: 8, value: null }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/milestones:
    get:
      operationId: listMilestoneProgress
      tags: [Milestones]
      summary: Milestone program progress for an agent
      description: |
        Backs the **Priority Milestones** cards on S-P4-01. Milestone progress
        follows each program's qualification cycle; it is NOT filtered by the
        dashboard period/business-line filters.

        Milestones are personal (SELF) achievements. The Team dashboard mock
        still shows them; pending OQ-10 they always return the leader's own
        milestones regardless of dashboard scope. (NOTE: this op's `scope`
        query param predates 1.1.0 and means card selection, not Scope.)
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: scope
          in: query
          schema:
            type: string
            enum: [PRIORITY, ALL]
            default: PRIORITY
        - name: variant
          in: query
          description: Valuation variant of the program figures.
          schema:
            $ref: '#/components/schemas/Variant'
      responses:
        '200':
          description: Milestone progress list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneProgressList'
              examples:
                my-priority:
                  summary: MDRT Series card (P4 mock 1)
                  value:
                    asOfDate: '2026-07-27'
                    items:
                      - programCode: MDRT_SERIES
                        variant: WITHOUT_REPRICING
                        cycleYear: 2026
                        currentTier: { code: MDRT }
                        nextTier: { code: COT }
                        progressPct: 60
                        measures:
                          - measureCode: FYP
                            achieved: { kind: MONEY, amount: '600000.00', currency: MYR }
                            target: { kind: MONEY, amount: '798400.00', currency: MYR }
                          - measureCode: FYC
                            achieved: { kind: MONEY, amount: '200000.00', currency: MYR }
                            target: { kind: MONEY, amount: '332800.00', currency: MYR }
                          - measureCode: ANNUAL_PREMIUM
                            achieved: { kind: MONEY, amount: '200000.00', currency: MYR }
                            target: { kind: MONEY, amount: '332800.00', currency: MYR }
                        asOfDate: '2026-07-27'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /metric-definitions:
    get:
      operationId: listMetricDefinitions
      tags: [Definitions]
      summary: Country metric catalog
      description: |
        Tenant-scoped catalog of metrics: value type, capabilities, allowed
        dimensions, default customization category and ordering. Drives
        S-P4-04 (Customize Metrics) and the BFF's capability checks.
        Scope-dependence is expressed **in the payload** (`scopes`,
        `scopeOverrides`) so one response serves both SELF and TEAM UIs.
      responses:
        '200':
          description: Metric definitions for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                required: [country, items]
                properties:
                  country:
                    type: string
                    pattern: '^[A-Z]{2}$'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricDefinition'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agents/{agentId}/metric-preferences:
    get:
      operationId: getMetricPreferences
      tags: [Preferences]
      summary: Get the agent's saved metric customization
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Saved preferences (country defaults if never saved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricPreferences'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putMetricPreferences
      tags: [Preferences]
      summary: Replace the agent's metric customization
      description: |
        Full replace (idempotent). Validation (422) enforces:
        - every code exists in the tenant catalog and is customizable
        - `priorityMetricCodes` length within the tenant's min/max
          (see `metric_definitions` + tenant policy; MY: exactly 4, locked set)
        - no code appears in both lists
        - every code's catalog entry lists the requested `scope` in `scopes`

        Preferences are stored **per scope**: a leader's SELF and TEAM
        customizations are independent documents.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPreferencesInput'
            example:
              priorityMetricCodes: [TPC, PTPC, CASE_COUNT, FYP]
              focusMetricCodes: [FYC, PERSISTENCY_CY]
      responses:
        '200':
          description: Saved preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricPreferences'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /agents/{agentId}/recommendations:
    get:
      operationId: listRecommendations
      tags: [Recommendations]
      summary: Performance recommendations for an agent
      description: |
        Backs the "Performance Recommendations" entry banner on S-P4-01.
        P4 consumes only the count/headline; the full recommendation surface
        is specified with P2/P3. Marked preview: response may gain fields.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Scope'
        - name: context
          in: query
          schema:
            type: string
            enum: [PERFORMANCE]
            default: PERFORMANCE
      responses:
        '200':
          description: Recommendation list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}/recommendations/{recommendationId}/feedback:
    post:
      operationId: submitRecommendationFeedback
      tags: [Recommendations]
      summary: Thumbs up/down on the AI recommendations panel
      description: >-
        Records the agent's rating of the generated panel (v1.1.0).
        Idempotent per (agent, recommendationId); a repeat call replaces the
        previous rating.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: recommendationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [UP, DOWN] }
      responses:
        '204': { description: Feedback recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/team-members:
    get:
      operationId: listTeamMembers
      tags: [TeamDrilldown]
      summary: List hierarchy members for Team Drilldown
      description: |
        Returns members visible to the requesting leader for Team Drilldown
        (S-P4-07). The hierarchy basis used here (`AGENT|AM|UM`) is a drilldown
        axis and is explicitly separate from the Performance metric `basis`
        (`STANDARD|SCHEME`).

        Gating follows existing team-view rulings: P3 leaders can request
        `teamView=DIRECT` only; P2 leaders can request `DIRECT` or `GROUP`.

        (1.8.0) Source: the caller's newest `my_agent_hierarchy` snapshot,
        selected as in `getAgentOrganization` (PAMB first; PBTB only when the
        root is absent; `asOnDate`, `audit.updatedAt`, `_id` descending).
        Members are the IDs in `subtree.scopeProfileIds`, in source order,
        deduplicated, excluding the caller's own ID. Each member resolves by
        `hierarchy.leaderId`. Its tier gives `hierarchyBasis`/`roleCode`
        (AM→AM, UM/UM1/UM2→UM, AGENT→AGENT, case-insensitive). The number of
        its own reportees gives `directReportCount`. A member without a
        hierarchy document is an `AGENT` with no `directReportCount`.
        `displayName` is the member ID; encrypted names are never projected.
        `tpc`/`ptpc` are the member's Personal values from the metric source
        for the requested lens, and are omitted when the member has no rows.
        `badges`, `goalStatus` and `photoUrl` have no approved source
        (OQ-79), are omitted, and a `badges` filter therefore matches no
        member. `summary` MANPOWER counts the filtered members and their
        downlines; other tiles carry no `value` until a source is approved.
        `parentMemberAgentId` must be visible under D-14 (P3 direct team,
        P2 whole downline) or the call returns 403.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/TeamView'
        - name: basis
          in: query
          description: |
            Hierarchy level grouping for drilldown list rendering.
            (1.6.0) When omitted, the list contains the caller's members of
            every level, each carrying its own `hierarchyBasis` (the S-P4-07
            "My Team" list mixes UMs and agents). Supplying a value still
            restricts the list to that level.
          schema:
            $ref: '#/components/schemas/DrilldownBasis'
        - name: query
          in: query
          description: Case-insensitive search on member id or display name.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: parentMemberAgentId
          in: query
          description: |
            (1.6.0) Lists the direct reports of this member instead of the
            caller's own team — the S-P4-07 subteam drawer. The member MUST be
            in the caller's downline (else 403 INS-4030). `teamView` gating is
            unchanged: a P3 caller may only open members of its DIRECT team.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{3,32}$'
        - name: sortBy
          in: query
          description: (1.6.0) Member ordering, descending by the named metric; ties by displayName ascending.
          schema:
            $ref: '#/components/schemas/TeamMemberSortBy'
        - name: badges
          in: query
          description: |
            (1.6.0) Comma-separated `MemberBadgeCode` filter. A member matches
            when it holds ANY listed badge (D-P4-07-02). Absent/empty = all
            members ("All Agent"). Only filterable codes are accepted; VIOLET
            (display-only, D-P4-07-01) or an unknown code returns 400.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/MemberBadgeCode' }
      responses:
        '200':
          description: Team member list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}/team-members/{memberAgentId}/dashboard:
    get:
      operationId: getTeamMemberDashboard
      tags: [TeamDrilldown]
      summary: Compose dashboard-style data for a selected member
      description: |
        Returns the selected member's dashboard payload and the request context
        used for S-P4-07 preview composition. This is additive and mirrors
        existing dashboard composition dimensions: period, business line,
        performance basis, and team-view.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: memberAgentId
          in: path
          required: true
          description: Selected member from `listTeamMembers`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{3,32}$'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/BusinessLine'
        - $ref: '#/components/parameters/Basis'
        - $ref: '#/components/parameters/TeamView'
      responses:
        '200':
          description: Selected member dashboard composition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberDashboard'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent code. Must equal token subject unless downline scope held.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{3,32}$'
    MetricCodePath:
      name: metricCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MetricCode'
    Period:
      name: period
      in: query
      description: Rolling period for snapshot values.
      schema:
        $ref: '#/components/schemas/PeriodType'
    BusinessLine:
      name: businessLine
      in: query
      schema:
        $ref: '#/components/schemas/BusinessLine'
    Basis:
      name: basis
      in: query
      description: >-
        Agent-segment lens (the dashboard "Scheme" toggle) — see the Basis
        schema. Affects catalog composition and goals; toggle visibility is
        entitlement-dependent (OQ-20).
      schema:
        $ref: '#/components/schemas/Basis'
    Scope:
      name: scope
      in: query
      description: >-
        Whose performance: the agent's own (SELF, default) or their team's
        (TEAM — Agent Leader persona switcher). TEAM requires the
        `insights:read:downline` scope on the token.
      schema:
        $ref: '#/components/schemas/Scope'
    TeamView:
      name: teamView
      in: query
      description: >-
        Team roll-up breadth when scope=TEAM (dashboard "Group" toggle):
        DIRECT (default) = agents reporting directly to the leader;
        GROUP = entire downline organisation. Ignored when scope=SELF.
        Leader-level gating (ruling 2026-08): P3 (first-line) leaders see
        DIRECT only; P2 (second-line) leaders — whose direct line includes P3
        leaders — may request DIRECT or GROUP. `teamView=GROUP` from a
        P3-level caller returns 403 (Problem code INS-4031).
      schema:
        $ref: '#/components/schemas/TeamView'

  responses:
    NotModified:
      description: Not modified (ETag matched).
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing/invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Token not permitted for this agent/tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown agent or metric for tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Semantically invalid (catalog/limit violations).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- Shared enums & primitives ----------
    MetricCode:
      type: string
      description: >
        Metric identifier. Governed by the tenant catalog
        (`/metric-definitions`) rather than a closed enum.
        Known P4 codes: TPC, PTPC, CASE_COUNT, FYP, FYC, PERSISTENCY_CY,
        PERSISTENCY_Y1, PERSISTENCY_Y2, NEW_RECRUIT_CONTRACTED.
        Known P2/P3 team (MAPA) codes: MANPOWER, ACTIVITY_RATIO, PRODUCTIVITY,
        AVERAGE_CASE_SIZE.
      pattern: '^[A-Z][A-Z0-9_]{1,39}$'
      x-extensible-enum: true

    PeriodType:
      type: string
      enum: [MTD, QTD, YTD]
      default: YTD
      x-extensible-enum: true

    BusinessLine:
      type: string
      description: '`ALL` renders as the "Both" / "Insurance + Takaful" label.'
      enum: [ALL, INSURANCE, TAKAFUL]
      default: ALL

    Basis:
      type: string
      description: >-
        Agent-segment lens (ruling 2026-08). STANDARD = agency-force view.
        SCHEME = Prudential-employed full-time agents — a different agent
        class with different goals and a smaller/different/re-ordered metric
        set. Toggling re-composes the dashboard via the catalog's
        `segmentOverrides` and selects segment-specific goals; it is NOT an
        alternate measurement of the same numbers. Wire values are unchanged
        from 1.0.0 (the key reservation pays off — no migration).
      enum: [STANDARD, SCHEME]
      default: STANDARD

    Scope:
      type: string
      description: SELF = agent's own performance; TEAM = leader's downline roll-up.
      enum: [SELF, TEAM]
      default: SELF

    TeamView:
      type: string
      description: DIRECT = direct reports only; GROUP = whole downline (only with scope=TEAM).
      enum: [DIRECT, GROUP]
      default: DIRECT

    DrilldownBasis:
      type: string
      description: >-
        Team Drilldown hierarchy basis (S-P4-07). This is independent from the
        performance `Basis` enum and MUST NOT be interpreted as
        STANDARD|SCHEME. (1.6.0: no default — an omitted `basis` on
        `listTeamMembers` means all levels.)
      enum: [AGENT, AM, UM]

    MeasureCode:
      type: string
      description: >-
        Sub-measure identifier (e.g. EXISTING_AGENTS / NEW_RECRUITS for
        MANPOWER since S-P4-02 v1.13.0 — OPENING / CLOSING are retained as
        reserved, no longer emitted for MANPOWER; FYP/FYC/ANNUAL_PREMIUM for
        milestones).
      pattern: '^[A-Z][A-Z0-9_]{1,39}$'
      x-extensible-enum: true

    Variant:
      type: string
      enum: [WITHOUT_REPRICING, WITH_REPRICING]
      default: WITHOUT_REPRICING

    ScalarKind:
      type: string
      enum: [MONEY, COUNT, PERCENT, DECIMAL]

    Sentiment:
      type: string
      description: Business favourability of a change/state, computed by metric rules.
      enum: [POSITIVE, NEGATIVE, NEUTRAL]

    TrendDirection:
      type: string
      enum: [UP, DOWN, FLAT]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string, 2 dp max. Never a float.
          pattern: '^-?\d{1,15}(\.\d{1,2})?$'
          example: '600000.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: MYR

    MoneyValue:
      type: object
      required: [kind, amount, currency]
      properties:
        kind: { type: string, enum: [MONEY] }
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,2})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'

    CountValue:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [COUNT] }
        value: { type: integer }

    PercentValue:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [PERCENT] }
        value:
          type: number
          description: 0–100 scale (95 = 95%). May exceed 100.

    DecimalValue:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [DECIMAL] }
        value:
          type: number
          description: Unitless ratio (e.g. PRODUCTIVITY 9.7 = cases per active agent).
        precision:
          type: integer
          default: 1
          description: Suggested decimal places for display.

    MetricScalar:
      description: Discriminated value union used everywhere a metric value appears (D-03).
      oneOf:
        - $ref: '#/components/schemas/MoneyValue'
        - $ref: '#/components/schemas/CountValue'
        - $ref: '#/components/schemas/PercentValue'
        - $ref: '#/components/schemas/DecimalValue'
      discriminator:
        propertyName: kind
        mapping:
          MONEY: '#/components/schemas/MoneyValue'
          COUNT: '#/components/schemas/CountValue'
          PERCENT: '#/components/schemas/PercentValue'
          DECIMAL: '#/components/schemas/DecimalValue'

    PeriodWindow:
      type: object
      required: [type, startDate, endDate]
      properties:
        type: { $ref: '#/components/schemas/PeriodType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    SnapshotContext:
      type: object
      required: [period, businessLine, basis, scope, asOfDate]
      properties:
        period: { $ref: '#/components/schemas/PeriodWindow' }
        businessLine: { $ref: '#/components/schemas/BusinessLine' }
        basis: { $ref: '#/components/schemas/Basis' }
        scope: { $ref: '#/components/schemas/Scope' }
        teamView:
          allOf: [{ $ref: '#/components/schemas/TeamView' }]
          description: Present only when scope=TEAM.
        asOfDate:
          type: string
          format: date
          description: Data watermark ("As of 27 Jul 2026").

    Change:
      type: object
      required: [basis, direction, sentiment]
      properties:
        basis:
          type: string
          enum: [LAST_YEAR]
          x-extensible-enum: true
        direction: { $ref: '#/components/schemas/TrendDirection' }
        sentiment: { $ref: '#/components/schemas/Sentiment' }
        pct:
          type: number
          description: >-
            Percentage change for metrics whose catalog `changeDisplay=PCT`
            ("+27% vs LY") — MONEY/COUNT metrics, plus the PERCENT metric
            ACTIVITY_RATIO since S-P4-02 v1.14.0, where it is the relative
            change of the ratio ((current − prior) / prior × 100), not a
            point difference, and the DECIMAL metric PRODUCTIVITY since
            S-P4-02 v1.15.0 (relative change of the exact decimal values,
            e.g. 9.7 vs 9.3 ⇒ 5, not the +0.4 difference); the MONEY metric
            AVERAGE_CASE_SIZE moved from ABS in S-P4-02 v1.16.0 (relative
            change of the exact decimal amounts, e.g. RM 5,200 vs RM 4,800
            ⇒ 9, not +RM 400). S-P4-02 v1.13.0:
            for metrics opted into the shared percent round-up rule
            (widget-contracts.md §2, `R-PCT-ROUNDUP` — MANPOWER,
            ACTIVITY_RATIO, PRODUCTIVITY, AVERAGE_CASE_SIZE) the domain emits an
            already-rounded integer, rounded away from zero from the exact
            unrounded change (+23.4 ⇒ 24, −23.4 ⇒ −24); consumers render it
            as-is.
        pp:
          type: number
          description: >-
            Percentage-point change for PERCENT metrics whose catalog
            `changeDisplay=PP` ("+2pp"). ACTIVITY_RATIO moved to
            `changeDisplay=PCT` in S-P4-02 v1.14.0 (ARVIJ-160); a `pp` value
            may still be present for it but is not rendered.
        abs:
          allOf: [{ $ref: '#/components/schemas/MetricScalar' }]
          description: >-
            Absolute change for metrics whose catalog `changeDisplay=ABS`
            (NEW_RECRUIT_CONTRACTED "+7"). MANPOWER moved to
            `changeDisplay=PCT` in S-P4-02 v1.13.0 (ARVIJ-159), PRODUCTIVITY
            (was "+0.4") in S-P4-02 v1.15.0 (ARVIJ-161) and
            AVERAGE_CASE_SIZE (was "+RM 20,000") in S-P4-02 v1.16.0
            (ARVIJ-162); an `abs` value may still be present for them but is
            not rendered.

    GoalProgress:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [SET, NOT_SET]
        target: { $ref: '#/components/schemas/MetricScalar' }
        progressPct:
          type: number
          minimum: 0
          description: collected/target × 100. May exceed 100. Absent when NOT_SET.

    # ---------- Metrics ----------
    MetricSnapshot:
      type: object
      required: [metricCode, valueType, asOfDate]
      properties:
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        valueType: { $ref: '#/components/schemas/ScalarKind' }
        variant:
          allOf: [{ $ref: '#/components/schemas/Variant' }]
          description: Present when the metric supports repricing (TPC, PTPC).
        dataState:
          type: string
          description: >-
            OK ⇒ `collected` and `goal` are present. PROCESSING ⇒ batch in
            flight. EMPTY ⇒ no approved upstream source, or batch complete with
            no data. Defaults to OK when omitted (1.4.0). A non-OK item keeps
            `metricCode`/`valueType` so the dashboard can render a card state
            rather than dropping the metric; `collected` is never zero-filled.
          enum: [OK, PROCESSING, EMPTY]
          default: OK
        notices:
          type: array
          description: Per-metric data-gap banners (e.g. a missing product feed).
          items: { $ref: '#/components/schemas/Notice' }
        collected: { $ref: '#/components/schemas/MetricScalar' }
        penders: { $ref: '#/components/schemas/MetricScalar' }
        subMeasures:
          type: array
          description: >-
            Named sub-values when the primary value decomposes
            (MANPOWER ⇒ EXISTING_AGENTS / NEW_RECRUITS since S-P4-02 v1.13.0,
            superseding OPENING / CLOSING; `collected` carries Total
            Manpower = EXISTING_AGENTS + NEW_RECRUITS).
          items:
            type: object
            required: [measureCode, value]
            properties:
              measureCode: { $ref: '#/components/schemas/MeasureCode' }
              value: { $ref: '#/components/schemas/MetricScalar' }
        goal: { $ref: '#/components/schemas/GoalProgress' }
        comparison: { $ref: '#/components/schemas/Change' }
        asOfDate: { type: string, format: date }

    Notice:
      type: object
      description: >-
        Data-quality banner shared by metric detail and dashboard cards
        (extracted to a component in 1.4.0; shape unchanged).
      required: [code, severity]
      properties:
        code:
          type: string
          description: 'i18n key suffix (insights.notice.{code}), e.g. PRODUCT_DATA_MISSING.'
          x-extensible-enum: true
        severity: { type: string, enum: [INFO, WARNING] }
        params:
          type: object
          additionalProperties: { type: string }
          description: 'i18n interpolation values, e.g. {"productCode": "CREDIT_POINTS"}.'

    MetricSnapshotList:
      type: object
      required: [context, items]
      properties:
        context: { $ref: '#/components/schemas/SnapshotContext' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MetricSnapshot' }

    VariantValue:
      type: object
      required: [variant, collected]
      properties:
        variant: { $ref: '#/components/schemas/Variant' }
        collected: { $ref: '#/components/schemas/MetricScalar' }
        penders: { $ref: '#/components/schemas/MetricScalar' }

    Threshold:
      type: object
      required: [value, comparator]
      properties:
        value:
          type: number
          description: Threshold on the metric's own scale (85 for 85%).
        comparator:
          type: string
          enum: [GTE, LTE]
          description: Direction that counts as meeting the threshold.

    BreakdownCell:
      type: object
      required: [businessLine, value]
      properties:
        businessLine: { $ref: '#/components/schemas/BusinessLine' }
        value: { $ref: '#/components/schemas/MetricScalar' }

    BreakdownRow:
      type: object
      required: [productCode, cells]
      properties:
        productCode:
          type: string
          description: >
            Product bucket. Known P4 codes for TPC/PTPC (v1.9.0, ARVIJ-106/164):
            LINKED_PREMIUM, REGULAR_PREMIUM, PSA, SINGLE_PREMIUM, CREDIT_POINTS.
            CREDIT_POINTS (v1.7.0, TPC/PTPC only) is pipeline-computed per the
            capped formula in mongodb.md §1 ("v1.7.0 (ARVIJ-19/157, D-19)"),
            not raw source data — see that note before mapping any new source
            field to this row. FYP (v1.11.0, ARVIJ-107/165) uses the older
            7-code set instead: the 5 codes above plus UNIT_TRUST and
            GROUP_PREMIUM; FYP's CREDIT_POINTS is a plain weightPct row, not
            the TPC/PTPC capped formula. UNIT_TRUST and GROUP_PREMIUM were
            reserved with no consuming metric from v1.9.0 (when PTPC's
            product-category definition was narrowed to the 5 codes above)
            until v1.11.0 activated them for FYP.
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
          x-extensible-enum: true
        weightPct:
          type: number
          description: Counting weight when not 100 (e.g. PSA 10%). Renders as "(10%)".
        cells:
          type: array
          items: { $ref: '#/components/schemas/BreakdownCell' }

    BreakdownTable:
      type: object
      required: [variant, columns, rows, totals]
      properties:
        variant: { $ref: '#/components/schemas/Variant' }
        columns:
          type: array
          description: >
            Column order for rendering. v1.8.0 (AC-P4-02-35): exactly one
            entry, equal to the request's businessLine (ALL renders a
            combined Insurance+Takaful value per row, not two columns) —
            never a fixed [INSURANCE, TAKAFUL] pair.
          items: { $ref: '#/components/schemas/BusinessLine' }
          minItems: 1
          maxItems: 1
        rows:
          type: array
          items: { $ref: '#/components/schemas/BreakdownRow' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/BreakdownCell' }

    MetricDetail:
      type: object
      required: [metricCode, valueType, context, dataState]
      properties:
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        valueType: { $ref: '#/components/schemas/ScalarKind' }
        context: { $ref: '#/components/schemas/SnapshotContext' }
        dataState:
          type: string
          description: >-
            OK ⇒ sections present. PROCESSING ⇒ batch in flight ("Data
            Temporarily Unavailable" + Refresh). EMPTY ⇒ no source activity
            ("No Data Available"). Non-OK responses omit value sections
            (v1.2.0; `primary`/`comparison` become conditional on OK).
          enum: [OK, PROCESSING, EMPTY]
        notices:
          type: array
          description: Dismissible data-quality banners on the detail screen.
          items: { $ref: '#/components/schemas/Notice' }
        primary:
          allOf: [{ $ref: '#/components/schemas/VariantValue' }]
          description: Default-variant value; `variant` omitted for non-repricing metrics.
        altVariants:
          type: array
          description: Alternate valuation variants (e.g. WITH_REPRICING card).
          items: { $ref: '#/components/schemas/VariantValue' }
        comparison:
          type: object
          required: [current, prior, priorYear, change]
          properties:
            current: { $ref: '#/components/schemas/MetricScalar' }
            prior: { $ref: '#/components/schemas/MetricScalar' }
            priorYear: { type: integer }
            change: { $ref: '#/components/schemas/Change' }
        threshold: { $ref: '#/components/schemas/Threshold' }
        breakdowns:
          type: array
          items: { $ref: '#/components/schemas/BreakdownTable' }
        barComparison:
          allOf: [{ $ref: '#/components/schemas/BarComparison' }]
          description: >-
            Year-over-year bar chart data when `capabilities.barComparison=true`
            (NEW_RECRUIT_CONTRACTED single-measure; MANPOWER stacked
            EXISTING_AGENTS/NEW_RECRUITS with per-year `totals` since S-P4-02
            v1.13.0, superseding grouped OPENING/CLOSING).

    BarComparison:
      type: object
      required: [years, measures]
      properties:
        years:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: integer }
          description: Ascending; last entry is the current cycle year.
        axis:
          type: object
          description: Optional axis hint (Manpower shows "No. of Agents").
          properties:
            unitCode:
              type: string
              description: i18n key suffix, e.g. AGENTS ⇒ insights.axis.AGENTS.
        layout:
          type: string
          enum: [GROUPED, STACKED]
          x-extensible-enum: true
          default: GROUPED
          description: >-
            S-P4-02 v1.13.0 (ARVIJ-159). STACKED ⇒ each year's measures stack
            into one bar whose height is that year's `totals` entry (MANPOWER:
            EXISTING_AGENTS + NEW_RECRUITS). Absent/GROUPED ⇒ the pre-v1.13.0
            behavior (side-by-side when ≥2 measures, simple bars when 1).
        totals:
          type: array
          description: >-
            Required when `layout=STACKED`, absent otherwise. One entry per
            `years` entry, same order; `value` equals the sum of the
            measures' points for that year (domain-computed, never summed by
            the UI). `change` is vs the previous year's total and is the
            only delta chip rendered in STACKED layout.
          items:
            type: object
            required: [year, value]
            properties:
              year: { type: integer }
              value: { $ref: '#/components/schemas/MetricScalar' }
              change: { $ref: '#/components/schemas/Change' }
        measures:
          type: array
          minItems: 1
          items:
            type: object
            required: [points]
            properties:
              measureCode:
                allOf: [{ $ref: '#/components/schemas/MeasureCode' }]
                description: Omitted for single-measure charts.
              points:
                type: array
                description: One point per entry in `years`, same order.
                items:
                  type: object
                  required: [year, value]
                  properties:
                    year: { type: integer }
                    value: { $ref: '#/components/schemas/MetricScalar' }
                    change:
                      allOf: [{ $ref: '#/components/schemas/Change' }]
                      description: >-
                        Vs same measure previous year (bar delta chip).
                        Omitted when the parent `layout=STACKED` — the
                        chip then comes from `totals[].change` (S-P4-02
                        v1.13.0).

    # ---------- Series ----------
    SeriesPoint:
      type: object
      required: [month, value]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        value:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/MetricScalar' }]
          description: Null when the month has no data yet (renders "-").

    YearSeries:
      type: object
      required: [year, points]
      properties:
        year: { type: integer }
        points:
          type: array
          minItems: 12
          maxItems: 12
          items: { $ref: '#/components/schemas/SeriesPoint' }

    MetricSeries:
      type: object
      required: [metricCode, valueType, context, anchorYear, series]
      properties:
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        valueType: { $ref: '#/components/schemas/ScalarKind' }
        context:
          type: object
          required: [businessLine, basis, asOfDate]
          properties:
            businessLine: { $ref: '#/components/schemas/BusinessLine' }
            basis: { $ref: '#/components/schemas/Basis' }
            asOfDate: { type: string, format: date }
        anchorYear: { type: integer }
        series:
          type: array
          description: Ordered anchor-year first, then descending prior years.
          items: { $ref: '#/components/schemas/YearSeries' }

    # ---------- Organization ----------
    AgentOrganization:
      type: object
      description: Recursive organization node. A missing descendant is an ID-only leaf; tier is omitted because the source role is unavailable.
      required: [agentId, displayName, reports]
      properties:
        agentId:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,32}$'
        displayName:
          type: string
          description: Always identical to agentId; source names are not exposed.
        tier:
          type: string
          enum: [P2, P3, P4]
          description: AM→P2; UM1/UM2→P3; AGENT→P4. Omitted when the descendant source document is missing.
        reports:
          type: array
          items:
            $ref: '#/components/schemas/AgentOrganization'

    # ---------- Milestones ----------
    TierRef:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Tier code from milestone_definitions (e.g. MDRT, COT, TOT).
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
          x-extensible-enum: true
        achievedAt: { type: string, format: date }

    MilestoneMeasure:
      type: object
      required: [measureCode, achieved, target]
      properties:
        measureCode:
          type: string
          description: Qualification measure (FYP, FYC, ANNUAL_PREMIUM, …).
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
          x-extensible-enum: true
        achieved: { $ref: '#/components/schemas/MetricScalar' }
        target: { $ref: '#/components/schemas/MetricScalar' }

    MilestoneProgress:
      type: object
      required: [programCode, variant, cycleYear, currentTier, progressPct, measures, asOfDate]
      properties:
        programCode:
          type: string
          description: Program code (MDRT_SERIES, STAR_CLUB, …).
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
          x-extensible-enum: true
        variant: { $ref: '#/components/schemas/Variant' }
        cycleYear: { type: integer }
        currentTier: { $ref: '#/components/schemas/TierRef' }
        nextTier:
          allOf: [{ $ref: '#/components/schemas/TierRef' }]
          description: Absent when the top tier is achieved.
        progressPct:
          type: number
          minimum: 0
          description: Progress toward next tier (min across measures). May exceed 100 pre-confirmation.
        measures:
          type: array
          items: { $ref: '#/components/schemas/MilestoneMeasure' }
        asOfDate: { type: string, format: date }

    MilestoneProgressList:
      type: object
      required: [asOfDate, items]
      properties:
        asOfDate: { type: string, format: date }
        items:
          type: array
          items: { $ref: '#/components/schemas/MilestoneProgress' }

    # ---------- Team Drilldown ----------
    TeamMember:
      type: object
      required: [agentId, displayName, hierarchyBasis, roleCode]
      properties:
        agentId:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,32}$'
        displayName:
          type: string
        hierarchyBasis:
          $ref: '#/components/schemas/DrilldownBasis'
        roleCode:
          type: string
          description: Role/group label from hierarchy source (e.g. AGENT, AM, UM).
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        teamView:
          $ref: '#/components/schemas/TeamView'
        badges:
          type: array
          description: >-
            (1.6.0) Qualification badges in display order. Absent when the
            source has none or no approved source exists (OQ-79) — never
            synthesized.
          items: { $ref: '#/components/schemas/MemberBadgeCode' }
        goalStatus:
          $ref: '#/components/schemas/TeamMemberGoalStatus'
        tpc:
          description: (1.6.0) Member TPC for the requested period; absent when unavailable.
          allOf: [{ $ref: '#/components/schemas/MetricScalar' }]
        ptpc:
          description: (1.6.0) Member PTPC for the requested period; absent when unavailable.
          allOf: [{ $ref: '#/components/schemas/MetricScalar' }]
        directReportCount:
          type: integer
          minimum: 0
          description: >-
            (1.6.0) Number of direct reports. Present and > 0 only for members
            who lead a team (UM/AM); drives the subteam affordance.
        photoUrl:
          type: string
          format: uri
          description: (1.6.0) Optional avatar image; absent ⇒ client renders an initials avatar.

    TeamMemberList:
      type: object
      required: [teamView, items]
      properties:
        basis:
          description: (1.6.0) Absent when the request omitted `basis` (all levels).
          allOf: [{ $ref: '#/components/schemas/DrilldownBasis' }]
        teamView:
          $ref: '#/components/schemas/TeamView'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        parent:
          description: (1.6.0) The member whose team is listed when `parentMemberAgentId` was supplied.
          allOf: [{ $ref: '#/components/schemas/TeamMember' }]
        summary:
          type: array
          description: >-
            (1.6.0) Team KPI tiles computed over the FILTERED member set
            (D-P4-07-02), in config order (MANPOWER, ACTIVITY_RATIO,
            PRODUCTIVITY, AVERAGE_CASE_SIZE for MY). A tile whose value is
            unavailable carries no `value` — never zero-filled.
          items:
            type: object
            required: [metricCode]
            properties:
              metricCode: { $ref: '#/components/schemas/MetricCode' }
              value: { $ref: '#/components/schemas/MetricScalar' }

    MemberBadgeCode:
      type: string
      x-extensible-enum: true
      description: >-
        (1.6.0) Member qualification badge. Groups (C4 `badgeGroups`):
        MDRT = MDRT|COT|TOT; PRUWEALTH_PLANNER = WP|EWP|SWP|PWP|MWP; PV; ROOKIE.
        VIOLET is display-only — not filterable, meaning owned by Product (OQ-80).
      enum: [MDRT, COT, TOT, WP, EWP, SWP, PWP, MWP, PV, ROOKIE, VIOLET]

    TeamMemberGoalStatus:
      type: string
      description: (1.6.0) Whether the member has set goals for the current cycle ("Goal set" / "Goal not set").
      enum: [SET, NOT_SET]

    TeamMemberSortBy:
      type: string
      description: (1.6.0) Team Drilldown member ordering (descending).
      enum: [TPC, PTPC]
      default: TPC

    TeamMemberDashboard:
      type: object
      required: [member, dashboard]
      properties:
        member:
          $ref: '#/components/schemas/TeamMember'
        dashboard:
          type: object
          description: Dashboard snapshot composed for the selected member.
          required: [context, metrics]
          properties:
            context:
              type: object
              required: [period, businessLine, basis, asOfDate]
              properties:
                period:
                  type: object
                  required: [type, startDate, endDate]
                  properties:
                    type: { $ref: '#/components/schemas/PeriodType' }
                    startDate: { type: string, format: date }
                    endDate: { type: string, format: date }
                businessLine: { $ref: '#/components/schemas/BusinessLine' }
                basis: { $ref: '#/components/schemas/Basis' }
                teamView: { $ref: '#/components/schemas/TeamView' }
                asOfDate: { type: string, format: date }
            metrics:
              type: array
              items: { $ref: '#/components/schemas/MetricSnapshot' }

    # ---------- Definitions & preferences ----------
    MetricCapabilities:
      type: object
      required: [goal, penders, repricing, breakdown, threshold, history]
      properties:
        goal: { type: boolean }
        penders: { type: boolean }
        repricing: { type: boolean }
        breakdown: { type: boolean }
        threshold: { type: boolean }
        history: { type: boolean }
        barComparison:
          type: boolean
          default: false
          description: Metric detail renders a YoY bar chart (v1.1.0).
        memberTable:
          type: boolean
          default: false
          description: >-
            Reserved (v1.1.0): per-member drilldown table exists in design but
            its endpoint is deferred until the Team Drilldown pack lands.

    MetricDefinition:
      type: object
      required: [metricCode, valueType, category, defaultSelected, defaultOrder, customizable, capabilities, dimensions]
      properties:
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        valueType: { $ref: '#/components/schemas/ScalarKind' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Present when valueType = MONEY.
        category:
          type: string
          enum: [PRIORITY, FOCUS]
          description: Default customization bucket on S-P4-04.
        defaultSelected: { type: boolean }
        defaultOrder: { type: integer }
        customizable:
          type: boolean
          description: false ⇒ locked (greyed check) in Customize Metrics.
        scopes:
          type: array
          description: Scopes where the metric exists. Defaults to [SELF].
          items: { $ref: '#/components/schemas/Scope' }
          default: [SELF]
        scopeOverrides:
          type: object
          description: >-
            Per-scope overrides of category/defaultSelected/defaultOrder.
            No MY metric uses a category override since 1.5.1
            (NEW_RECRUIT_CONTRACTED is FOCUS at both SELF and TEAM).
          additionalProperties:
            type: object
            properties:
              category: { type: string, enum: [PRIORITY, FOCUS] }
              defaultSelected: { type: boolean }
              defaultOrder: { type: integer }
        segmentOverrides:
          type: object
          description: >-
            Per-segment (Basis) overrides, keyed STANDARD|SCHEME (v1.3.0).
            `included:false` removes the metric from that segment's catalog —
            this is how SCHEME gets a smaller/different/re-ordered set.
            Segment goals live in `metric_snapshots.goal` per basis key.
          additionalProperties:
            type: object
            properties:
              included: { type: boolean, default: true }
              category: { type: string, enum: [PRIORITY, FOCUS] }
              defaultSelected: { type: boolean }
              defaultOrder: { type: integer }
        favourability:
          type: string
          enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER]
          default: HIGHER_IS_BETTER
          description: Lets the BFF compute month-over-month sentiment for history (D-11).
        changeDisplay:
          type: string
          enum: [PCT, PP, ABS]
          default: PCT
          description: >-
            Which Change field the UI renders for this metric (D-10).
            MANPOWER is PCT since S-P4-02 v1.13.0 (was ABS). ACTIVITY_RATIO
            is PCT since S-P4-02 v1.14.0 (was PP; ARVIJ-160). PRODUCTIVITY
            is PCT since S-P4-02 v1.15.0 (was ABS; ARVIJ-161).
        capabilities: { $ref: '#/components/schemas/MetricCapabilities' }
        dimensions:
          type: object
          required: [periods, businessLines, basis]
          properties:
            periods:
              type: array
              items: { $ref: '#/components/schemas/PeriodType' }
            businessLines:
              type: array
              items: { $ref: '#/components/schemas/BusinessLine' }
            basis:
              type: array
              items: { $ref: '#/components/schemas/Basis' }
        threshold: { $ref: '#/components/schemas/Threshold' }

    MetricPreferences:
      type: object
      required: [priorityMetricCodes, focusMetricCodes, source, updatedAt]
      properties:
        priorityMetricCodes:
          type: array
          items: { $ref: '#/components/schemas/MetricCode' }
        focusMetricCodes:
          type: array
          items: { $ref: '#/components/schemas/MetricCode' }
        source:
          type: string
          enum: [DEFAULT, AGENT]
          description: DEFAULT = country defaults (never saved).
        updatedAt:
          type: string
          format: date-time
          nullable: true

    MetricPreferencesInput:
      type: object
      required: [priorityMetricCodes, focusMetricCodes]
      properties:
        priorityMetricCodes:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/MetricCode' }
        focusMetricCodes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MetricCode' }

    # ---------- Recommendations ----------
    Recommendation:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string }
        type:
          type: string
          x-extensible-enum: true
        title: { type: string }
        body: { type: string }
        priority: { type: integer }
        cta:
          type: object
          properties:
            route: { type: string, description: In-app route token. }

    RecommendationFlag:
      type: object
      required: [code, severity]
      properties:
        code:
          type: string
          description: i18n-resolvable flag code (e.g. PERFORMANCE_DROPS, HISTORIC_PACE_EXCEEDED).
          x-extensible-enum: true
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]

    RecommendationHighlight:
      type: object
      description: Hero metric line of the AI panel ("152K TPC secured / 200K Goal (76%) / 8% above run-rate").
      required: [metricCode, achieved]
      properties:
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        achieved: { $ref: '#/components/schemas/MetricScalar' }
        goal: { $ref: '#/components/schemas/GoalProgress' }
        runRateDeltaPct:
          type: number
          description: Signed % vs expected run-rate (+8 ⇒ "8% above run-rate").

    RecommendationInsight:
      type: object
      description: Tappable insight card ("Average case size ↑ 5 spots this month", "Critical Anomalies …").
      required: [code, titleCode]
      properties:
        code: { type: string, description: Stable insight id for analytics/feedback. }
        titleCode:
          type: string
          description: i18n key suffix (insights.reco.insight.{titleCode}).
          x-extensible-enum: true
        metricCode: { $ref: '#/components/schemas/MetricCode' }
        trend:
          type: object
          properties:
            direction: { $ref: '#/components/schemas/TrendDirection' }
            sentiment: { $ref: '#/components/schemas/Sentiment' }
            text: { type: string, description: Engine-generated ("5 spots this month"). }
        narrative:
          type: string
          description: Engine-generated body copy (pre-localised by the engine).
        cta:
          type: object
          properties:
            route: { type: string }

    RecommendationPanel:
      type: object
      description: Structured payload behind the expanded "Performance Recommendations" panel (v1.1.0).
      required: [flags, generatedAt]
      properties:
        flags:
          type: array
          items: { $ref: '#/components/schemas/RecommendationFlag' }
        highlight: { $ref: '#/components/schemas/RecommendationHighlight' }
        insights:
          type: array
          items: { $ref: '#/components/schemas/RecommendationInsight' }
        cta:
          type: object
          description: Panel-level CTA ("View Team Drilldown").
          properties:
            route: { type: string }
        generatedAt: { type: string, format: date-time }
        feedback:
          type: object
          description: Caller's previously submitted rating, if any.
          properties:
            rating: { type: string, enum: [UP, DOWN] }

    RecommendationList:
      type: object
      required: [items, generatedAt]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        panel:
          allOf: [{ $ref: '#/components/schemas/RecommendationPanel' }]
          description: Present when the tenant enables the AI panel.
        generatedAt: { type: string, format: date-time }

    # ---------- Errors ----------
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine code (e.g. INS-4041 metric-not-in-catalog).
        traceId: { type: string }
